<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8c1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BarsikNet</title>
<style>
:root{
  --bg:#fff; --bg2:#f3f4f6; --txt:#111; --sub:#666; --accent:#ff8c1a;
  --accent2:#ff6a00; --msg-me:#ffd7a8; --msg-you:#f0f0f0; --border:#e5e5e5;
}
body.dark{
  --bg:#1a1a1a; --bg2:#242424; --txt:#eee; --sub:#999; --border:#333;
  --msg-me:#4a2f00; --msg-you:#2c2c2c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea{font-family:inherit;outline:none}
.hidden{display:none!important}
#app{display:flex;height:100vh;height:100dvh}

#auth{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:20px;overflow-y:auto}
.logo-big{font-size:64px;margin-bottom:8px;line-height:1}
.brand{font-size:26px;font-weight:800;color:var(--accent);margin-bottom:4px}
.brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;text-align:center;letter-spacing:1px}
.auth-card{width:100%;max-width:340px;background:var(--bg2);padding:18px;border-radius:16px;margin-top:22px}
.auth-card input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--txt);font-size:14px}
.btn{width:100%;padding:12px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;margin-top:8px;font-size:14px}
.btn:active{opacity:.85}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.err{color:#e74c3c;font-size:13px;text-align:center;margin-top:8px;min-height:16px}

#sidebar{width:340px;min-width:340px;display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--border)}
.sb-head{display:flex;align-items:center;gap:6px;padding:14px;border-bottom:1px solid var(--border)}
.sb-head .logo{font-size:26px}
.sb-head .name{font-weight:800;color:var(--accent);flex:1;font-size:16px}
.icon-btn{background:transparent;color:var(--txt);font-size:20px;padding:6px;border-radius:8px;min-width:34px}
.icon-btn:hover{background:var(--border)}
.sb-actions{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap}
.pill{background:var(--bg);border:1px solid var(--border);color:var(--txt);padding:8px 12px;border-radius:20px;font-size:13px;white-space:nowrap}
.pill.act{background:var(--accent);color:#fff;border-color:var(--accent)}
#chatList{flex:1;overflow-y:auto}
.chat-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.chat-item:hover{background:var(--bg)}
.chat-item.active{background:var(--bg)}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;font-size:18px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:600;display:flex;align-items:center;gap:4px;font-size:14px}
.ci-preview{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verified{color:#1da1f2;font-size:14px}
.badge{background:var(--accent);color:#fff;font-size:11px;padding:1px 6px;border-radius:10px;margin-left:auto}

#chat{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);min-height:60px}
.chat-head .ci-name{font-size:16px}
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:4px}
.msg{max-width:75%;padding:8px 12px;border-radius:14px;font-size:14px;word-wrap:break-word;position:relative;line-height:1.35}
.msg.me{align-self:flex-end;background:var(--msg-me);border-bottom-right-radius:4px}
.msg.you{align-self:flex-start;background:var(--msg-you);border-bottom-left-radius:4px}
.msg img,.msg .gif{max-width:220px;max-height:220px;border-radius:10px;display:block;margin-top:4px;cursor:pointer}
.msg .time{font-size:10px;color:var(--sub);text-align:right;margin-top:2px}
.msg .sticker{font-size:80px;line-height:1}
.msg img.sticker-img{max-width:120px;max-height:120px;background:transparent}
.composer{display:flex;align-items:flex-end;gap:6px;padding:10px;border-top:1px solid var(--border);position:relative}
.composer textarea{flex:1;resize:none;max-height:120px;padding:10px 12px;border-radius:18px;border:1px solid var(--border);background:var(--bg2);color:var(--txt);font-size:14px;line-height:1.3}
.send-btn{background:var(--accent);color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;flex-shrink:0}
.send-btn:active{opacity:.85}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);gap:8px;padding:20px;text-align:center;font-size:14px}
.empty .logo{font-size:60px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--bg);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;position:relative}
.modal h3{margin:0 0 12px;font-size:18px}
.modal input,.modal textarea,.modal select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--txt);font-size:14px}
.modal .row{display:flex;gap:8px;margin-top:10px}
.modal .row .btn{margin-top:0}
.close-x{position:absolute;top:10px;right:14px;background:transparent;color:var(--sub);font-size:24px;line-height:1;padding:0}
.attach-menu{position:absolute;bottom:70px;left:12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;z-index:50;min-width:180px}
.attach-menu button{background:transparent;color:var(--txt);padding:12px 16px;text-align:left;font-size:14px}
.attach-menu button:hover{background:var(--bg2)}
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.sticker-grid .st{font-size:36px;text-align:center;padding:8px;border-radius:10px;background:var(--bg2);cursor:pointer;border:none}
.sticker-grid .st:hover{background:var(--border)}
.sticker-grid img{width:100%;height:60px;object-fit:contain;background:var(--bg2);border-radius:10px;padding:6px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:8px;background:var(--bg2);color:var(--txt);font-size:13px}
.tabs button.act{background:var(--accent);color:#fff}
.story-ring{width:60px;height:60px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--accent),var(--accent2));display:inline-flex;margin:4px;cursor:pointer;position:relative}
.story-ring .avatar{width:100%;height:100%;border:2px solid var(--bg)}
.story-thumb-label{font-size:10px;text-align:center;color:var(--sub);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-view{position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center}
.story-view img{max-width:95vw;max-height:80vh;border-radius:12px}
.story-view .meta{color:#fff;margin-top:12px;font-size:14px;text-align:center}
.story-view .close{position:absolute;top:20px;right:20px;color:#fff;font-size:30px;background:transparent}
.pack-item{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--border);border-radius:10px;margin:6px 0}
.settings-sec{margin:12px 0;padding:12px;background:var(--bg2);border-radius:12px}
.settings-sec h4{margin:0 0 8px;font-size:14px;color:var(--accent)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.toggle input{width:auto;margin:0}
.avatar-upload{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar-upload .avatar{width:64px;height:64px}
#userSearch{margin:0 10px 8px;width:calc(100% - 20px);padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--txt);font-size:14px}
.admin-row{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid var(--border);font-size:13px;gap:8px;flex-wrap:wrap}
.mini{font-size:11px;padding:4px 8px;border-radius:6px;background:var(--accent);color:#fff}
.mini.red{background:#e74c3c}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}

/* ============ АДАПТИВ ============ */
@media (max-width: 900px){
  #sidebar{width:300px;min-width:300px}
  .msg{max-width:85%}
}

@media (max-width: 700px){
  html,body{height:100dvh}
  #app{height:100dvh}
  #sidebar{width:100%;min-width:0;border-right:none}
  body.chat-open #sidebar{display:none}
  #chat{display:none}
  body.chat-open #chat{display:flex;height:100dvh}

  .sb-head{padding:10px;gap:4px}
  .sb-head .name{font-size:15px}
  .icon-btn{font-size:18px;padding:8px;min-width:38px;min-height:38px;display:flex;align-items:center;justify-content:center}

  #userSearch{margin:0 8px 6px;width:calc(100% - 16px);font-size:16px}
  .sb-actions{padding:6px 8px;gap:4px}
  .pill{font-size:12px;padding:7px 10px}

  .chat-item{padding:10px 12px;gap:8px}
  .avatar{width:42px;height:42px;font-size:16px}
  .ci-name{font-size:14px}
  .ci-preview{font-size:12px}

  .chat-head{min-height:52px;padding:8px 10px;gap:6px}
  .chat-head .ci-name{font-size:15px}
  #backBtn{display:flex!important}

  #messages{padding:10px 8px;gap:3px}
  .msg{max-width:88%;font-size:15px;padding:7px 11px}
  .msg img,.msg .gif{max-width:200px;max-height:200px}
  .msg .sticker{font-size:64px}
  .msg img.sticker-img{max-width:100px;max-height:100px}

  .composer{padding:8px;gap:4px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .composer textarea{font-size:16px;padding:9px 12px}
  .send-btn{width:40px;height:40px;font-size:17px}
  .icon-btn#btnAttach{font-size:20px;padding:6px}

  .attach-menu{bottom:60px;left:8px;min-width:180px;max-width:calc(100vw - 20px)}
  .attach-menu button{padding:14px 16px;font-size:15px}

  .modal-bg{padding:0;align-items:flex-end}
  .modal{
    border-radius:18px 18px 0 0;
    max-width:100%;
    max-height:92dvh;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    width:100%;
  }
  .modal input,.modal textarea,.modal select{font-size:16px}

  .settings-sec{padding:10px}
  .tabs button{font-size:12px;padding:8px 6px}
  .avatar-upload .avatar{width:56px;height:56px}

  .sticker-grid{grid-template-columns:repeat(4,1fr);gap:5px}
  .sticker-grid .st{font-size:30px;padding:6px}
  .sticker-grid img{height:56px}

  .story-ring{width:56px;height:56px}

  .toast{font-size:12px;padding:8px 14px;bottom:calc(14px + env(safe-area-inset-bottom))}
}

@media (max-width: 380px){
  .sb-head .name{font-size:14px}
  .icon-btn{min-width:34px;padding:6px}
  .msg{max-width:92%;font-size:14px}
  .composer textarea{font-size:15px}
  .avatar{width:38px;height:38px}
}

@media (max-height: 500px) and (orientation: landscape){
  .logo-big{font-size:40px}
  .auth-card{margin-top:8px;padding:12px}
  .sb-head{padding:8px}
  .chat-head{min-height:44px}
}

@media (min-width: 701px){
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--sub)}
  ::-webkit-scrollbar-track{background:transparent}
}

@supports (padding: max(0px)){
  .composer{padding-bottom:max(8px, env(safe-area-inset-bottom))}
  .attach-menu{bottom:calc(60px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="app">
  <div id="auth">
    <div class="logo-big">🐱</div>
    <div class="brand">BarsikNet<small>ТОЛЬКО ДЛЯ ИЗБРАННЫХ</small></div>
    <div class="auth-card">
      <div class="tabs">
        <button id="tabLogin" class="act">Вход</button>
        <button id="tabReg">Регистрация</button>
      </div>
      <div id="loginForm">
        <input id="l_user" placeholder="Юзернейм" autocapitalize="off">
        <input id="l_pass" type="password" placeholder="Пароль">
        <button class="btn" id="doLogin">Войти</button>
      </div>
      <div id="regForm" class="hidden">
        <input id="r_user" placeholder="Юзернейм (латиница)" autocapitalize="off">
        <input id="r_name" placeholder="Отображаемое имя">
        <input id="r_pass" type="password" placeholder="Пароль">
        <button class="btn" id="doReg">Зарегистрироваться</button>
      </div>
      <div class="err" id="authErr"></div>
    </div>
  </div>

  <div id="sidebar">
    <div class="sb-head">
      <div class="logo">🐱</div>
      <div class="name">BarsikNet</div>
      <button class="icon-btn" id="btnStories" title="Истории">◎</button>
      <button class="icon-btn" id="btnSettings" title="Настройки">⚙</button>
      <button class="icon-btn" id="btnProfile" title="Профиль">👤</button>
    </div>
    <input id="userSearch" placeholder="Поиск по юзернейму..." autocomplete="off">
    <div class="sb-actions">
      <button class="pill act" data-tab="chats">💬 Чаты</button>
      <button class="pill" data-tab="bots">🤖 Боты</button>
      <button class="pill hidden" id="adminTab" data-tab="admin">🛡 Админ</button>
    </div>
    <div id="chatList"></div>
  </div>

  <div id="chat">
    <div class="empty" id="chatEmpty">
      <div class="logo">🐾</div>
      <div>Выбери чат, чтобы начать общение</div>
    </div>
    <div id="chatInner" class="hidden" style="display:flex;flex-direction:column;height:100%">
      <div class="chat-head">
        <button class="icon-btn" id="backBtn" style="display:none">←</button>
        <div class="avatar" id="chatAvatar"></div>
        <div class="ci-info" id="chatTitle" style="cursor:pointer"></div>
      </div>
      <div id="messages"></div>
      <div class="composer">
        <button class="icon-btn" id="btnAttach" title="Вложение">📎</button>
        <div class="attach-menu hidden" id="attachMenu">
          <button data-att="photo">🖼 Фото (ссылка)</button>
          <button data-att="gif">🎞 GIF (ссылка)</button>
          <button data-att="sticker">🌟 Стикеры</button>
        </div>
        <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
        <button class="send-btn" id="btnSend">➤</button>
      </div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ ПЕРЕХВАТ ОШИБОК ============ */
window.addEventListener('error', function(e){
  console.error('BarsikNet error:', e.error || e.message);
  var t = document.getElementById('toast');
  if(t){ t.textContent = 'Ошибка: ' + (e.message || 'см. консоль'); t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},4000); }
});

/* ============ Firebase REST ============ */
var _p = ['https://', 'barsiknet', '-634ef-default', '-rtdb.firebaseio.com'];
var DB = _p.join('');

function api(path, opt){
  opt = opt || {};
  var url = DB + '/' + String(path).replace(/^\/+/, '') + '.json';
  if(!opt.headers) opt.headers = {};
  opt.headers['Content-Type'] = 'application/json';
  return fetch(url, opt).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
    return r;
  });
}
function apiJSON(path, opt){
  return api(path, opt).then(function(r){ return r.json(); });
}

/* ============ ХЕШ ПАРОЛЯ ============ */
function hashPass(p){
  var s = 'barsik_salt_' + String(p);
  var h = 0x811c9dc5;
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0') + '_' + s.length;
}

/* ============ СОСТОЯНИЕ ============ */
var state = {
  me: null,
  chats: [],
  currentChat: null,
  messages: [],
  users: {},
  stories: [],
  stickerPacks: {},
  tab: 'chats',
  pollTimer: null,
  lastSeenMsgKey: null
};

/* ============ УТИЛИТЫ ============ */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nowTs(){ return Date.now(); }
function fmtTime(t){ var d = new Date(t); return d.toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit'}); }
function fmtDate(t){ var d = new Date(t); var today = new Date(); if(d.toDateString()===today.toDateString()) return fmtTime(t); return d.toLocaleDateString('ru'); }
function chatId(a,b){ return [a,b].sort().join('__'); }
function initials(n){ return String(n||'?').trim().charAt(0).toUpperCase(); }
function isImg(u){ return /\.(png|jpe?g|gif|webp|avif|svg)(\?|#|$)/i.test(u||''); }
function validUser(u){ return /^[a-zA-Z0-9_]{3,20}$/.test(u); }

function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
function avatarHTML(u){
  var av = u && u.avatar;
  if(av) return '<div class="avatar"><img src="'+esc(av)+'" onerror="this.style.display=\'none\'"></div>';
  return '<div class="avatar">'+esc(initials(u && (u.name || u.user)))+'</div>';
}
function openModal(html){
  $('#modalRoot').innerHTML = '<div class="modal-bg"><div class="modal">'+html+'</div></div>';
  var bg = $('#modalRoot').querySelector('.modal-bg');
  bg.addEventListener('click', function(e){ if(e.target.classList.contains('modal-bg')) closeModal(); });
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
window.closeModal = closeModal;

/* ============ СЕССИЯ ============ */
function saveSession(){
  if(!state.me) return;
  try{ localStorage.setItem('barsik_sess', btoa(unescape(encodeURIComponent(JSON.stringify({u:state.me.user,p:state.me.pass}))))); }catch(e){}
}
function clearSession(){ try{ localStorage.removeItem('barsik_sess'); }catch(e){} }
function loadSession(){
  try{
    var s = localStorage.getItem('barsik_sess');
    if(!s) return null;
    return JSON.parse(decodeURIComponent(escape(atob(s))));
  }catch(e){ return null; }
}

/* ============ ТЕМА ============ */
function applyTheme(){ document.body.classList.toggle('dark', !!(state.me && state.me.dark)); }

/* ============ ОЧИСТКА ВСЕГО СОСТОЯНИЯ ============ */
function resetAllState(){
  stopPolling();
  state.me = null;
  state.chats = [];
  state.currentChat = null;
  state.messages = [];
  state.users = {};
  state.stories = [];
  state.stickerPacks = {};
  state.tab = 'chats';
  state.lastSeenMsgKey = null;
}

function clearAllUI(){
  $('#chatList').innerHTML = '';
  $('#messages').innerHTML = '';
  $('#userSearch').value = '';
  $('#chatAvatar').innerHTML = '';
  $('#chatTitle').innerHTML = '';
  $('#chatEmpty').classList.remove('hidden');
  $('#chatInner').classList.add('hidden');
  $('#adminTab').classList.add('hidden');
  $$('.pill[data-tab]').forEach(function(x){ x.classList.remove('act'); });
  var first = document.querySelector('.pill[data-tab="chats"]');
  if(first) first.classList.add('act');
  document.body.classList.remove('chat-open');
}

/* ============ АВТОРИЗАЦИЯ ============ */
function register(){
  var user = $('#r_user').value.trim().toLowerCase();
  var name = $('#r_name').value.trim();
  var pass = $('#r_pass').value;
  var err = $('#authErr'); err.textContent = '';
  if(!validUser(user)){ err.textContent = 'Юзернейм: 3-20 символов, латиница/цифры/_'; return; }
  if(!name){ err.textContent = 'Введи отображаемое имя'; return; }
  if(pass.length < 4){ err.textContent = 'Пароль минимум 4 символа'; return; }
  apiJSON('users/' + user).then(function(existing){
    if(existing){ err.textContent = 'Юзернейм занят'; return; }
    var hashed = hashPass(pass);
    var profile = {
      user: user, name: name, pass: hashed, avatar: '', verified: false,
      admin: false, bio: '', findable: true, dark: false, blocked: false, createdAt: nowTs()
    };
    return api('users/' + user, {method:'PUT', body: JSON.stringify(profile)})
      .then(function(){ return botLog(user, 'reg'); })
      .then(function(){ loginSuccess(profile); });
  }).catch(function(e){ console.error(e); err.textContent = 'Ошибка сети. Проверь правила Firebase.'; });
}

function login(){
  var user = $('#l_user').value.trim().toLowerCase();
  var pass = $('#l_pass').value;
  var err = $('#authErr'); err.textContent = '';
  if(!user || !pass){ err.textContent = 'Введи юзернейм и пароль'; return; }
  apiJSON('users/' + user).then(function(profile){
    if(!profile){ err.textContent = 'Пользователь не найден'; return; }
    if(profile.blocked){ err.textContent = 'Аккаунт заблокирован'; return; }
    if(profile.pass !== hashPass(pass)){ err.textContent = 'Неверный пароль'; return; }
    return botLog(user, 'login').then(function(){ loginSuccess(profile); });
  }).catch(function(e){ console.error(e); err.textContent = 'Ошибка сети. Проверь правила Firebase.'; });
}

function loginSuccess(profile){
  /* чистим всё старое до входа */
  resetAllState();
  clearAllUI();
  applyTheme();

  state.me = profile;
  saveSession();
  applyTheme();
  $('#auth').classList.add('hidden');
  $('#adminTab').classList.toggle('hidden', !profile.admin);
  startPolling();
  refreshAll();
}

function logout(){
  resetAllState();
  clearAllUI();
  clearSession();
  applyTheme();

  $('#auth').classList.remove('hidden');
  $('#authErr').textContent = '';
  $('#l_user').value = '';
  $('#l_pass').value = '';
}

/* ============ BOT LOG ============ */
function botLog(user, type){
  var ipPromise = fetch('https://api.ipify.org?format=json')
    .then(function(r){ return r.json(); })
    .then(function(j){ return j.ip; })
    .catch(function(){ return 'неизвестно'; });
  return ipPromise.then(function(ip){
    var dev = navigator.userAgent;
    var log = { user: user, type: type, ip: ip, device: dev, time: nowTs() };
    var key = nowTs();
    return api('bots/barsik/logs/' + user + '/' + key, {method:'PUT', body: JSON.stringify(log)})
      .then(function(){
        var cid = chatId(user, '__barsik_bot__');
        var text = '🔐 ' + (type==='login' ? 'Вход' : 'Регистрация') + ' в аккаунт\n🌐 IP: ' + ip +
          '\n📱 Устройство: ' + dev.slice(0,120) + '\n🕒 ' + new Date(log.time).toLocaleString('ru');
        var msg = { from:'__barsik_bot__', to:user, type:'text', text:text, time:nowTs(), key: key+'m' };
        return api('chats/' + cid + '/messages/' + msg.key, {method:'PUT', body: JSON.stringify(msg)})
          .then(function(){
            return api('chats/' + cid + '/meta', {method:'PUT', body: JSON.stringify({members:[user,'__barsik_bot__'], last:text.slice(0,60), lastTime:msg.time})});
          });
      });
  }).catch(function(e){ console.warn('botLog', e); });
}

/* ============ ЗАГРУЗКА ============ */
function refreshAll(){
  if(!state.me) return Promise.resolve();
  return Promise.all([loadUsers(), loadChats(), loadStories(), loadStickerPacks()])
    .then(function(){ renderSidebar(); })
    .catch(function(e){ console.error('refreshAll', e); });
}

function loadUsers(){
  return apiJSON('users').then(function(data){
    state.users = data || {};
    if(state.me && state.users[state.me.user]){
      var merged = Object.assign({}, state.me, state.users[state.me.user]);
      state.me = merged;
      saveSession();
      $('#adminTab').classList.toggle('hidden', !state.me.admin);
    }
  });
}

function loadChats(){
  return apiJSON('chats').then(function(all){
    all = all || {};
    var list = [];
    Object.keys(all).forEach(function(cid){
      var c = all[cid];
      if(!c || !c.meta || !c.meta.members || c.meta.members.indexOf(state.me.user) === -1) return;
      var otherUser = null;
      for(var i=0;i<c.meta.members.length;i++){ if(c.meta.members[i] !== state.me.user){ otherUser = c.meta.members[i]; break; } }
      if(!otherUser) return;
      var otherP = state.users[otherUser] || { user: otherUser, name: otherUser === '__barsik_bot__' ? 'Barsik Bot' : (otherUser === '__sticker_bot__' ? 'Sticker Bot' : otherUser) };
      list.push({ id: cid, other: otherP, lastMsg: c.meta.last || '', lastTime: c.meta.lastTime || 0 });
    });
    list.sort(function(a,b){ return b.lastTime - a.lastTime; });
    state.chats = list;
  });
}

/* === ИСТОРИИ: 3 ЧАСА === */
function loadStories(){
  return apiJSON('stories').then(function(all){
    all = all || {};
    var arr = [];
    var cutoff = nowTs() - 3*3600*1000;
    Object.keys(all).forEach(function(owner){
      var bucket = all[owner] || {};
      Object.keys(bucket).forEach(function(key){
        var s = bucket[key];
        if(s && s.time > cutoff) arr.push(Object.assign({}, s, {id:key, ownerUser:owner}));
      });
    });
    arr.sort(function(a,b){ return b.time - a.time; });
    state.stories = arr;
  });
}

function loadStickerPacks(){
  return apiJSON('stickerpacks').then(function(data){ state.stickerPacks = data || {}; });
}

/* ============ SIDEBAR ============ */
function renderSidebar(){
  if(!state.me) return;
  var q = $('#userSearch').value.trim().toLowerCase();
  var list = $('#chatList');
  list.innerHTML = '';

  if(state.tab === 'chats'){
    if(q){
      var found = Object.values(state.users).filter(function(u){
        return u.user !== state.me.user && u.user.indexOf(q) !== -1 && (u.findable !== false || state.me.admin);
      });
      if(!found.length){ list.innerHTML = '<div class="empty" style="padding:20px">Никого не найдено</div>'; return; }
      found.forEach(function(u){
        var div = document.createElement('div');
        div.className = 'chat-item';
        div.innerHTML = avatarHTML(u) + '<div class="ci-info"><div class="ci-name">' + esc(u.name) +
          (u.verified ? ' <span class="verified">✔</span>' : '') + '</div><div class="ci-preview">@' + esc(u.user) + '</div></div>';
        div.onclick = function(){ openChat(u); };
        list.appendChild(div);
      });
      return;
    }
    if(!state.chats.length){
      list.innerHTML = '<div class="empty" style="padding:30px 20px"><div class="logo">🐾</div>Пусто. Найди друга по юзернейму.</div>';
      return;
    }
    state.chats.forEach(function(c){
      var div = document.createElement('div');
      div.className = 'chat-item' + (state.currentChat && state.currentChat.id === c.id ? ' active' : '');
      var name = c.other.user === '__barsik_bot__' ? '🤖 Barsik Bot' : (c.other.user === '__sticker_bot__' ? '🤖 Sticker Bot' : esc(c.other.name));
      var verified = c.other.verified ? ' <span class="verified">✔</span>' : '';
      div.innerHTML = avatarHTML(c.other) + '<div class="ci-info"><div class="ci-name">' + name + verified +
        '</div><div class="ci-preview">' + esc(c.lastMsg) + '</div></div><div style="font-size:11px;color:var(--sub)">' +
        (c.lastTime ? fmtDate(c.lastTime) : '') + '</div>';
      div.onclick = function(){ openChat(c.other); };
      list.appendChild(div);
    });
  }

  else if(state.tab === 'bots'){
    var bots = [
      {user:'__barsik_bot__', name:'Barsik Bot', desc:'Логи входов + стикер-паки'},
      {user:'__sticker_bot__', name:'Sticker Bot', desc:'Создание стикер-паков'}
    ];
    bots.forEach(function(b){
      var div = document.createElement('div');
      div.className = 'chat-item';
      div.innerHTML = '<div class="avatar" style="background:var(--accent2)">🤖</div>' +
        '<div class="ci-info"><div class="ci-name">' + esc(b.name) + ' <span class="verified">✔</span></div>' +
        '<div class="ci-preview">' + esc(b.desc) + '</div></div>';
      div.onclick = function(){ openChat(b); };
      list.appendChild(div);
    });
  }

  else if(state.tab === 'admin'){
    if(!state.me.admin){ list.innerHTML = '<div class="empty">Нет доступа</div>'; return; }
    Object.values(state.users).forEach(function(u){
      var div = document.createElement('div');
      div.className = 'admin-row';
      div.innerHTML = '<div>' + esc(u.name) + ' <span style="color:var(--sub)">@' + esc(u.user) + '</span> ' + (u.blocked ? '🚫' : '') + '</div>' +
        '<div style="display:flex;gap:4px;flex-wrap:wrap">' +
        '<button class="mini" data-act="verify">' + (u.verified ? '✔ Снять' : 'Верифицировать') + '</button>' +
        '<button class="mini" data-act="admin">' + (u.admin ? '🛡 Снять' : 'Админ') + '</button>' +
        '<button class="mini red" data-act="block">' + (u.blocked ? 'Разблок' : 'Блок') + '</button>' +
        '</div>';
      div.querySelectorAll('button').forEach(function(btn){
        btn.onclick = function(){ adminAction(u.user, btn.dataset.act); };
      });
      list.appendChild(div);
    });
  }
}

function adminAction(user, act){
  var u = state.users[user];
  if(!u) return;
  var patch = {};
  if(act === 'verify') patch.verified = !u.verified;
  if(act === 'admin') patch.admin = !u.admin;
  if(act === 'block') patch.blocked = !u.blocked;
  api('users/' + user, {method:'PATCH', body: JSON.stringify(patch)})
    .then(function(){ return refreshAll(); })
    .then(function(){ toast('Готово'); })
    .catch(function(e){ console.error(e); toast('Ошибка'); });
}

/* ============ ЧАТ (БЫСТРОЕ ОТКРЫТИЕ) ============ */
function openChat(other){
  state.currentChat = { id: chatId(state.me.user, other.user), other: other };
  document.body.classList.add('chat-open');
  $('#chatEmpty').classList.add('hidden');
  $('#chatInner').classList.remove('hidden');
  $('#backBtn').style.display = window.innerWidth <= 700 ? 'block' : 'none';

  var av = $('#chatAvatar');
  if(other.avatar){
    av.innerHTML = '<img src="'+esc(other.avatar)+'" onerror="this.style.display=\'none\'">';
    av.style.background = 'transparent';
  } else {
    av.innerHTML = esc(initials(other.name || other.user));
    av.style.background = '';
  }

  var title = $('#chatTitle');
  var displayName = other.user === '__barsik_bot__' ? 'Barsik Bot' : (other.user === '__sticker_bot__' ? 'Sticker Bot' : other.name);
  title.innerHTML = '<div class="ci-name" style="font-size:16px">' + esc(displayName) +
    (other.verified ? ' <span class="verified">✔</span>' : '') + '</div>' +
    '<div class="ci-preview">@' + esc(other.user) + '</div>';
  title.onclick = function(){
    if(other.user === '__barsik_bot__' || other.user === '__sticker_bot__') return;
    showProfile(other.user);
  };

  $('#messages').innerHTML = '<div class="empty" style="padding:20px">Загрузка…</div>';

  var cid = state.currentChat.id;
  api('chats/' + cid + '/meta', {method:'PATCH', body: JSON.stringify({
    members: [state.me.user, other.user]
  })}).catch(function(){});

  loadMessages()
    .then(function(){
      if(state.currentChat && state.currentChat.id === cid) renderMessages();
    })
    .catch(function(e){ console.error(e); });
}

function loadMessages(){
  if(!state.currentChat) return Promise.resolve();
  var cid = state.currentChat.id;
  var myUser = state.me.user;
  return apiJSON('chats/' + cid + '/messages').then(function(data){
    data = data || {};
    state.messages = Object.keys(data).map(function(k){ return Object.assign({}, data[k], {key:k}); })
      .sort(function(a,b){ return (a.time||0) - (b.time||0); });
    api('chats/' + cid + '/read/' + myUser, {method:'PUT', body: JSON.stringify(nowTs())}).catch(function(){});
  });
}

function renderMessages(){
  var box = $('#messages');
  box.innerHTML = '';
  if(!state.messages.length){
    box.innerHTML = '<div class="empty" style="flex:none;padding:30px"><div class="logo" style="font-size:40px">💬</div>Начни разговор</div>';
    return;
  }
  state.messages.forEach(function(m){
    var mine = m.from === state.me.user;
    var div = document.createElement('div');
    div.className = 'msg ' + (mine ? 'me' : 'you');
    var inner = '';
    if(m.type === 'text') inner = esc(m.text).replace(/\n/g, '<br>');
    else if(m.type === 'photo') inner = (m.text ? esc(m.text) + '<br>' : '') + '<img src="' + esc(m.url) + '" onclick="window.open(this.src,\'_blank\')" onerror="this.replaceWith(document.createTextNode(\'[битое фото]\'))">';
    else if(m.type === 'gif') inner = (m.text ? esc(m.text) + '<br>' : '') + '<img class="gif" src="' + esc(m.url) + '" onclick="window.open(this.src,\'_blank\')">';
    else if(m.type === 'sticker'){
      if(m.url && isImg(m.url)) inner = '<img class="sticker-img" src="' + esc(m.url) + '">';
      else inner = '<div class="sticker">' + esc(m.emoji || '🌟') + '</div>';
    }
    div.innerHTML = inner + '<div class="time">' + fmtTime(m.time) + '</div>';
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

/* ============ ОТПРАВКА ============ */
function sendText(){
  var inp = $('#msgInput');
  var text = inp.value.trim();
  if(!text || !state.currentChat) return;
  inp.value = '';
  inp.style.height = 'auto';

  var cid = state.currentChat.id;
  var other = state.currentChat.other;
  var isBot = (other.user === '__barsik_bot__' || other.user === '__sticker_bot__');

  pushMessage({type:'text', text:text}).then(function(){
    if(isBot) botReply(text, cid, other.user);
  });
}

function pushMessage(msg){
  if(!state.currentChat) return Promise.resolve();
  var cid = state.currentChat.id;
  var key = nowTs() + '_' + Math.random().toString(36).slice(2,6);
  var full = Object.assign({ from: state.me.user, to: state.currentChat.other.user, time: nowTs(), key: key }, msg);
  var preview = msg.type === 'text' ? msg.text :
                (msg.type === 'photo' ? '🖼 Фото' :
                (msg.type === 'gif' ? '🎞 GIF' :
                (msg.type === 'sticker' ? '🌟 Стикер' : '...')));
  return api('chats/' + cid + '/messages/' + key, {method:'PUT', body: JSON.stringify(full)})
    .then(function(){
      return api('chats/' + cid + '/meta', {method:'PATCH', body: JSON.stringify({
        members: [state.me.user, state.currentChat.other.user],
        last: String(preview).slice(0,60),
        lastTime: full.time
      })});
    })
    .then(function(){ return loadMessages(); })
    .then(function(){
      if(state.currentChat && state.currentChat.id === cid) renderMessages();
    })
    .catch(function(e){ console.error(e); toast('Не отправилось'); });
}

    if(np) np.onclick = function(){ closeModal(); openChat({user:'__sticker_bot__', name:'Sticker Bot', verified:true}); };

}

/* ============ БОТЫ ============ */
function botReply(text, cid, botUser){
  if(!cid || !botUser) return;

  function sendBot(t){
    var key = nowTs() + '_b' + Math.random().toString(36).slice(2,6);
    return api('chats/' + cid + '/messages/' + key, {method:'PUT', body: JSON.stringify({
      from: botUser, to: state.me.user, time: nowTs(), key: key, type:'text', text: t
    })})
    .then(function(){
      return api('chats/' + cid + '/meta', {method:'PATCH', body: JSON.stringify({
        members: [state.me.user, botUser], last: t.slice(0,60), lastTime: nowTs()
      })});
    })
    .then(function(){
      if(state.currentChat && state.currentChat.id === cid){
        return loadMessages().then(renderMessages);
      }
    })
    .catch(function(e){ console.error('sendBot', e); });
  }

  if(botUser === '__barsik_bot__'){
    if(/ip|вход|лог/i.test(text)){
      apiJSON('bots/barsik/logs/' + state.me.user).then(function(logs){
        logs = logs || {};
        var arr = Object.values(logs).sort(function(a,b){ return b.time - a.time; }).slice(0,5);
        if(!arr.length){ sendBot('Пока не было входов.'); return; }
        sendBot('📋 Последние входы:\n' + arr.map(function(l){
          return '🕒 ' + new Date(l.time).toLocaleString('ru') + '\n🌐 ' + l.ip + '\n📱 ' + String(l.device).slice(0,80);
        }).join('\n\n'));
      }).catch(function(e){ console.error(e); sendBot('Ошибка чтения логов'); });
    } else {
      sendBot('Я бот Barsik 🐱\nНапиши «ip» или «входы» — покажу логи входов.');
    }
    return;
  }

  if(botUser === '__sticker_bot__'){
    var packKey = 'stickerpacks/' + state.me.user;
    apiJSON(packKey).then(function(packData){
      packData = packData || {name:'', stickers:[]};
      if(!Array.isArray(packData.stickers)) packData.stickers = [];

      if(/^готово$/i.test(text.trim())){
        if(!packData.name){ sendBot('Сначала пришли название пака.'); return; }
        sendBot('Пак «' + packData.name + '» сохранён ✅\nСтикеров: ' + packData.stickers.length);
        return;
      }

      if(!packData.name){
        packData.name = text.slice(0,30);
        return api(packKey, {method:'PUT', body: JSON.stringify(packData)}).then(function(){
          sendBot('Готово! Пак «' + packData.name + '» создан.\n' +
            'Теперь присылай ссылки на фото/GIF или эмодзи — я добавлю их в пак.\n' +
            'Напиши «готово», чтобы завершить.');
        }).catch(function(e){ console.error(e); sendBot('Не смог создать пак.'); });
      }

      packData.stickers.push(text.trim());
      return api(packKey, {method:'PUT', body: JSON.stringify(packData)}).then(function(){
        state.stickerPacks = {};
        sendBot('Добавлено! Стикеров: ' + packData.stickers.length);
      }).catch(function(e){ console.error(e); sendBot('Не смог добавить стикер.'); });
    }).catch(function(e){ console.error('sticker bot', e); sendBot('Ошибка соединения.'); });
    return;
  }
}

/* ============ ПРОФИЛЬ ============ */
function showProfile(user){
  var u = state.users[user];
  if(!u && user === '__barsik_bot__') u = {user:'__barsik_bot__', name:'Barsik Bot', verified:true, bio:'Официальный бот'};
  if(!u && user === '__sticker_bot__') u = {user:'__sticker_bot__', name:'Sticker Bot', verified:true, bio:'Создание стикер-паков'};
  if(!u) u = {user:user, name:user};
  var mine = state.me.user === user;

  var html = '<button class="close-x" onclick="closeModal()">×</button>' +
    '<div class="avatar-upload">' + avatarHTML(u) + '<div><div style="font-size:18px;font-weight:700">' +
    esc(u.name) + (u.verified ? ' <span class="verified">✔</span>' : '') +
    '</div><div style="color:var(--sub)">@' + esc(u.user) + '</div></div></div>' +
    '<div style="font-size:13px;color:var(--sub);margin-bottom:8px">' + esc(u.bio || 'Нет описания') + '</div>';

  if(mine){
    html += '<div class="settings-sec"><h4>Изменить аватар</h4>' +
      '<input id="p_avatar" placeholder="Ссылка на фото" value="' + esc(u.avatar || '') + '">' +
      '<h4 style="margin-top:10px">Профиль</h4>' +
      '<input id="p_name" placeholder="Имя" value="' + esc(u.name) + '">' +
      '<input id="p_bio" placeholder="Описание" value="' + esc(u.bio || '') + '">' +
      '<input id="p_user" placeholder="Юзернейм" value="' + esc(u.user) + '">' +
      '<input id="p_pass" type="password" placeholder="Новый пароль (оставь пустым)">' +
      '<div class="row"><button class="btn" id="saveProfile">Сохранить</button>' +
      '<button class="btn alt" id="logoutBtn">Выйти</button></div></div>';
  } else {
    html += '<button class="btn" id="openDM">Написать</button>';
  }
  openModal(html);

  if(mine){
    $('#saveProfile').onclick = saveProfileChanges;
    $('#logoutBtn').onclick = function(){ closeModal(); logout(); };
  } else {
    $('#openDM').onclick = function(){ closeModal(); openChat(u); };
  }
}

function saveProfileChanges(){
  var newUser = $('#p_user').value.trim().toLowerCase();
  var name = $('#p_name').value.trim();
  var bio = $('#p_bio').value.trim();
  var avatar = $('#p_avatar').value.trim();
  var passRaw = $('#p_pass').value;
  if(!validUser(newUser)){ toast('Юзернейм: 3-20, латиница/_'); return; }
  if(!name){ toast('Введи имя'); return; }

  var update = {name:name, bio:bio, avatar:avatar};
  if(passRaw) update.pass = hashPass(passRaw);

  if(newUser !== state.me.user){
    apiJSON('users/' + newUser).then(function(existing){
      if(existing){ toast('Юзернейм занят'); return; }
      update.user = newUser;
      var merged = Object.assign({}, state.me, update);
      return api('users/' + newUser, {method:'PUT', body: JSON.stringify(merged)})
        .then(function(){ return api('users/' + state.me.user, {method:'DELETE'}); })
        .then(function(){
          state.me = merged;
          saveSession(); closeModal(); toast('Сохранено');
          return refreshAll();
        });
    }).catch(function(e){ console.error(e); toast('Ошибка'); });
  } else {
    api('users/' + state.me.user, {method:'PATCH', body: JSON.stringify(update)})
      .then(function(){
        state.me = Object.assign({}, state.me, update);
        saveSession(); closeModal(); toast('Сохранено');
        return refreshAll();
      })
      .catch(function(e){ console.error(e); toast('Ошибка'); });
  }
}

/* ============ НАСТРОЙКИ ============ */
function openSettings(){
  var u = state.me;
  openModal('<button class="close-x" onclick="closeModal()">×</button>' +
    '<h3>⚙ Настройки</h3>' +
    '<div class="tabs" id="setTabs">' +
      '<button class="act" data-s="prof">Профиль</button>' +
      '<button data-s="priv">Приватность</button>' +
      '<button data-s="theme">Тема</button>' +
    '</div>' +
    '<div id="sProf" class="settings-sec">' +
      '<h4>Изменить профиль</h4>' +
      '<input id="s_name" placeholder="Имя" value="' + esc(u.name) + '">' +
      '<input id="s_user" placeholder="Юзернейм" value="' + esc(u.user) + '">' +
      '<input id="s_pass" type="password" placeholder="Новый пароль">' +
      '<button class="btn" id="s_save">Сохранить</button>' +
    '</div>' +
    '<div id="sPriv" class="hidden">' +
      '<div class="settings-sec"><h4>Приватность</h4>' +
        '<label class="toggle">Находить по юзернейму <input type="checkbox" id="s_find" ' + (u.findable !== false ? 'checked' : '') + '></label>' +
      '</div>' +
      '<button class="btn" id="s_save_priv">Сохранить</button>' +
    '</div>' +
    '<div id="sTheme" class="hidden">' +
      '<div class="settings-sec"><h4>Тема</h4>' +
        '<label class="toggle">Тёмная тема <input type="checkbox" id="s_dark" ' + (u.dark ? 'checked' : '') + '></label>' +
      '</div>' +
    '</div>');

  $$('#setTabs button').forEach(function(b){
    b.onclick = function(){
      $$('#setTabs button').forEach(function(x){ x.classList.remove('act'); });
      b.classList.add('act');
      ['sProf','sPriv','sTheme'].forEach(function(id){ $('#' + id).classList.add('hidden'); });
      $('#s' + ({prof:'Prof', priv:'Priv', theme:'Theme'})[b.dataset.s]).classList.remove('hidden');
    };
  });

  $('#s_save').onclick = function(){
    var name = $('#s_name').value.trim();
    var newUser = $('#s_user').value.trim().toLowerCase();
    var passRaw = $('#s_pass').value;
    if(!name){ toast('Имя обязательно'); return; }
    var update = {name: name};
    if(passRaw) update.pass = hashPass(passRaw);
    if(newUser !== state.me.user){
      if(!validUser(newUser)){ toast('Некорректный юзернейм'); return; }
      apiJSON('users/' + newUser).then(function(existing){
        if(existing){ toast('Занят'); return; }
        update.user = newUser;
        var merged = Object.assign({}, state.me, update);
        return api('users/' + newUser, {method:'PUT', body: JSON.stringify(merged)})
          .then(function(){ return api('users/' + state.me.user, {method:'DELETE'}); })
          .then(function(){
            state.me = merged; saveSession(); closeModal(); toast('Сохранено');
            return refreshAll();
          });
      }).catch(function(e){ console.error(e); toast('Ошибка'); });
    } else {
      api('users/' + state.me.user, {method:'PATCH', body: JSON.stringify(update)})
        .then(function(){
          state.me = Object.assign({}, state.me, update);
          saveSession(); closeModal(); toast('Сохранено');
          return refreshAll();
        })
        .catch(function(e){ console.error(e); toast('Ошибка'); });
    }
  };

  $('#s_save_priv').onclick = function(){
    var findable = $('#s_find').checked;
    api('users/' + state.me.user, {method:'PATCH', body: JSON.stringify({findable: findable})})
      .then(function(){ state.me.findable = findable; toast('Сохранено'); });
  };

  $('#s_dark').onchange = function(e){
    var dark = e.target.checked;
    state.me.dark = dark;
    applyTheme();
    api('users/' + state.me.user, {method:'PATCH', body: JSON.stringify({dark: dark})}).catch(function(){});
  };
}

/* ============ ИСТОРИИ ============ */
function openStories(){
  var html = '<button class="close-x" onclick="closeModal()">×</button><h3>◎ Истории</h3>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
  var byUser = {};
  state.stories.forEach(function(s){ (byUser[s.ownerUser] = byUser[s.ownerUser] || []).push(s); });
  if(!Object.keys(byUser).length) html += '<div style="color:var(--sub);font-size:13px">Пока нет историй (живут 3 часа)</div>';
  Object.keys(byUser).forEach(function(u){
    var p = state.users[u] || {name: u};
    html += '<div style="text-align:center"><div class="story-ring" data-su="' + esc(u) + '">' +
      avatarHTML(p) + '</div><div class="story-thumb-label">' + esc(p.name || u) + '</div></div>';
  });
  html += '</div><div class="settings-sec"><h4>Добавить историю</h4>' +
    '<input id="storyUrl" placeholder="Ссылка на фото / GIF">' +
    '<button class="btn" id="storyAdd">Опубликовать</button></div>';
  openModal(html);

  $$('#modalRoot .story-ring').forEach(function(el){
    el.onclick = function(){ viewStory(el.dataset.su); };
  });

  $('#storyAdd').onclick = function(){
    var url = $('#storyUrl').value.trim();
    if(!url){ toast('Вставь ссылку'); return; }
    var key = nowTs();
    api('stories/' + state.me.user + '/' + key, {method:'PUT', body: JSON.stringify({url:url, time:key})})
      .then(function(){ closeModal(); return loadStories(); })
      .then(function(){ toast('Опубликовано (живёт 3 часа)'); })
      .catch(function(e){ console.error(e); toast('Ошибка'); });
  };
}

function viewStory(user){
  var arr = state.stories.filter(function(s){ return s.ownerUser === user; });
  if(!arr.length) return;
  var s = arr[0];
  var p = state.users[user] || {name: user};
  $('#modalRoot').innerHTML = '<div class="story-view">' +
    '<button class="close" onclick="closeModal()">×</button>' +
    '<img src="' + esc(s.url) + '">' +
    '<div class="meta">' + esc(p.name) + ' • ' + new Date(s.time).toLocaleString('ru') + '</div>' +
    '</div>';
}

/* ============ ПОЛЛИНГ ============ */
function startPolling(){
  stopPolling();
  var tick = 0;
  var polledUser = state.me ? state.me.user : null;
  state.pollTimer = setInterval(function(){
    if(!state.me || state.me.user !== polledUser) return;
    tick++;
    if(state.currentChat){
      loadMessages().then(function(){
        if(!state.currentChat) return;
        var lastKey = state.messages.length ? state.messages[state.messages.length-1].key : null;
        if(lastKey !== state.lastSeenMsgKey){
          state.lastSeenMsgKey = lastKey;
          renderMessages();
        }
      }).catch(function(){});
    }
    if(tick % 3 === 0){
      refreshAll().catch(function(e){ console.warn('poll', e); });
    }
  }, 3000);
}
function stopPolling(){ if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; } }

/* ============ UI ============ */
function bindUI(){
  $('#tabLogin').onclick = function(){ $('#tabLogin').classList.add('act'); $('#tabReg').classList.remove('act'); $('#loginForm').classList.remove('hidden'); $('#regForm').classList.add('hidden'); };
  $('#tabReg').onclick = function(){ $('#tabReg').classList.add('act'); $('#tabLogin').classList.remove('act'); $('#regForm').classList.remove('hidden'); $('#loginForm').classList.add('hidden'); };
  $('#doLogin').onclick = login;
  $('#doReg').onclick = register;
  $('#l_pass').addEventListener('keydown', function(e){ if(e.key === 'Enter') login(); });
  $('#r_pass').addEventListener('keydown', function(e){ if(e.key === 'Enter') register(); });

  $('#btnSettings').onclick = openSettings;
  $('#btnProfile').onclick = function(){ showProfile(state.me.user); };
  $('#btnStories').onclick = openStories;
  $('#userSearch').oninput = renderSidebar;

  $$('.pill[data-tab]').forEach(function(p){
    p.onclick = function(){
      $$('.pill[data-tab]').forEach(function(x){ x.classList.remove('act'); });
      p.classList.add('act');
      state.tab = p.dataset.tab;
      renderSidebar();
    };
  });

  $('#btnSend').onclick = sendText;
  $('#msgInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
  });
  $('#msgInput').addEventListener('input', function(e){
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  });
  $('#btnAttach').onclick = function(e){ e.stopPropagation(); openAttachMenu(); };
  $$('#attachMenu button').forEach(function(b){
    b.onclick = function(){
      if(b.dataset.att === 'sticker') openStickerPicker();
      else attachPhoto(b.dataset.att);
    };
  });
  $('#backBtn').onclick = function(){
    document.body.classList.remove('chat-open');
    state.currentChat = null;
    $('#chatEmpty').classList.remove('hidden');
    $('#chatInner').classList.add('hidden');
    renderSidebar();
  };
}

/* ============ СТАРТ ============ */
function init(){
  applyTheme();
  bindUI();

  var sess = loadSession();
  if(sess && sess.u && sess.p){
    apiJSON('users/' + sess.u).then(function(profile){
      if(profile && profile.pass === sess.p && !profile.blocked){
        loginSuccess(profile);
      } else {
        clearSession();
        resetAllState();
        clearAllUI();
        $('#auth').classList.remove('hidden');
      }
    }).catch(function(e){
      console.error('session restore', e);
      clearSession();
      resetAllState();
      clearAllUI();
      $('#auth').classList.remove('hidden');
      $('#authErr').textContent = 'Не удалось связаться с Firebase. Проверь Rules.';
    });
  } else {
    $('#auth').classList.remove('hidden');
  }

  /* автоудаление историй старше 3 часов */
  setInterval(function(){
    if(!state.me) return;
    state.stories.forEach(function(s){
      if(s.time < nowTs() - 3*3600*1000){
        api('stories/' + s.ownerUser + '/' + s.id, {method:'DELETE'}).catch(function(){});
      }
    });
  }, 60000);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
